<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 对话助手</title>
    <!-- 用 unpkg，国内一般能访问。如果两个都失败，脚本会自动降级为纯文本，不影响发送 -->
    <script src="https://unpkg.com/marked/marked.min.js"></script>
    <script src="https://unpkg.com/dompurify@3/dist/purify.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 760px;
            height: 85vh;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 18px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .header-info h2 {
            font-size: 17px;
            font-weight: 600;
        }

        .header-info p {
            font-size: 12px;
            opacity: 0.85;
            margin-top: 2px;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f7f8fb;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            gap: 10px;
            max-width: 80%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message .msg-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .message.ai .msg-avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }

        .message.user .msg-avatar {
            background: #e0e0e0;
        }

        .bubble {
            padding: 10px 14px;
            border-radius: 14px;
            line-height: 1.6;
            font-size: 14px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message.ai .bubble {
            background: #fff;
            border: 1px solid #ececf1;
            border-top-left-radius: 4px;
            white-space: normal;
        }

        .message.user .bubble {
            background: #667eea;
            color: #fff;
            border-top-right-radius: 4px;
        }

        /* ===== Markdown 渲染样式 ===== */
        .bubble h1, .bubble h2, .bubble h3 {
            margin: 12px 0 6px;
            font-weight: 600;
            line-height: 1.4;
        }
        .bubble h1 { font-size: 18px; }
        .bubble h2 { font-size: 16px; }
        .bubble h3 { font-size: 15px; }

        .bubble p { margin: 6px 0; }

        .bubble ul, .bubble ol {
            padding-left: 20px;
            margin: 6px 0;
        }
        .bubble li { margin: 3px 0; }

        .bubble code {
            background: #f0f0f5;
            padding: 2px 5px;
            border-radius: 4px;
            font-size: 13px;
            font-family: "SFMono-Regular", Consolas, monospace;
        }

        .bubble pre {
            background: #1e1e2e;
            color: #e0e0e0;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
        }
        .bubble pre code {
            background: transparent;
            padding: 0;
            color: inherit;
        }

        .bubble table {
            border-collapse: collapse;
            margin: 8px 0;
            font-size: 13px;
            width: 100%;
        }
        .bubble th, .bubble td {
            border: 1px solid #ddd;
            padding: 6px 10px;
            text-align: left;
        }
        .bubble th {
            background: #f5f5fa;
            font-weight: 600;
        }

        .bubble blockquote {
            border-left: 3px solid #667eea;
            padding-left: 10px;
            color: #666;
            margin: 8px 0;
        }

        .bubble a {
            color: #667eea;
            text-decoration: none;
        }
        .bubble a:hover { text-decoration: underline; }

        .bubble hr {
            border: none;
            border-top: 1px solid #ececf1;
            margin: 12px 0;
        }

        /* ===== 打字动画 ===== */
        .typing {
            display: inline-flex;
            gap: 4px;
            padding: 4px 0;
        }

        .typing span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #999;
            animation: blink 1.4s infinite both;
        }

        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1); }
        }

        .chat-input-area {
            padding: 14px 20px;
            border-top: 1px solid #ececf1;
            background: #fff;
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        #messageInput {
            flex: 1;
            resize: none;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            max-height: 120px;
            transition: border-color 0.2s;
        }

        #messageInput:focus {
            border-color: #667eea;
        }

        #sendBtn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.15s, opacity 0.2s;
            flex-shrink: 0;
        }

        #sendBtn:hover:not(:disabled) {
            transform: translateY(-1px);
        }

        #sendBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 滚动条美化 */
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: #d0d0d8;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="avatar">🤖</div>
            <div class="header-info">
                <h2>AI 游戏观察员</h2>
                <p>联网搜索 · 实时分析热门游戏</p>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message ai">
                <div class="msg-avatar">🤖</div>
                <div class="bubble">你好！我是游戏信息观察员，可以帮你搜索当前最火爆的游戏、分析热度趋势。有什么想问的？</div>
            </div>
        </div>

        <div class="chat-input-area">
            <textarea id="messageInput" rows="1" placeholder="输入消息，按 Enter 发送..."></textarea>
            <button id="sendBtn">发送</button>
        </div>
    </div>

    <script>
        // ===== 获取 DOM =====
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');

        // ===== 检测 CDN 是否加载成功（关键：加载失败也不崩）=====
        const hasMarkdown = (typeof marked !== 'undefined') && (typeof DOMPurify !== 'undefined');

        if (hasMarkdown) {
            marked.setOptions({
                breaks: true,   // 单个 \n 也换行
                gfm: true       // 支持表格、删除线等
            });
            console.log('Markdown 渲染已启用');
        } else {
            console.warn('marked 或 DOMPurify 未加载，AI 回答将以纯文本显示');
        }

        // Markdown -> 安全 HTML
        function renderMarkdown(text) {
            if (!hasMarkdown) {
                // 降级：纯文本，保留换行
                const div = document.createElement('div');
                div.textContent = text || '';
                return div.innerHTML.replace(/\n/g, '<br>');
            }
            const rawHtml = marked.parse(text || '');
            return DOMPurify.sanitize(rawHtml);
        }

        // ===== 自动调整输入框高度 =====
        messageInput.addEventListener('input', function () {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        // ===== 回车发送，Shift+Enter 换行 =====
        messageInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // ===== 按钮点击发送 =====
        sendBtn.addEventListener('click', sendMessage);

        // ===== 追加消息 =====
        function appendMessage(role, text) {
            const div = document.createElement('div');
            div.className = 'message ' + role;

            const avatar = document.createElement('div');
            avatar.className = 'msg-avatar';
            avatar.textContent = role === 'ai' ? '🤖' : '🧑';

            const bubble = document.createElement('div');
            bubble.className = 'bubble';

            if (role === 'ai') {
                bubble.innerHTML = renderMarkdown(text);
            } else {
                bubble.textContent = text;
            }

            div.appendChild(avatar);
            div.appendChild(bubble);
            chatMessages.appendChild(div);
            scrollToBottom();
            return div;
        }

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // ===== 发送消息 =====
        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            sendBtn.disabled = true;
            messageInput.value = '';
            messageInput.style.height = 'auto';

            appendMessage('user', text);

            // 显示 loading 动画
            const loadingEl = appendMessage('ai', '');
            loadingEl.querySelector('.bubble').innerHTML =
                '<div class="typing"><span></span><span></span><span></span></div>';

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message: text })
                });

                if (!res.ok) throw new Error(`HTTP ${res.status}`);

                const data = await res.json();
                console.log(data);

                loadingEl.querySelector('.bubble').innerHTML =
                    renderMarkdown(data.data);

            } catch (err) {
                console.error(err);
                loadingEl.querySelector('.bubble').textContent =
                    '抱歉，出错了：' + err.message;

            } finally {
                sendBtn.disabled = false;
                messageInput.focus();
            }
        }

        messageInput.focus();
    </script>
</body>
</html>
